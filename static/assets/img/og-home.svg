<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <!-- Subtle decorative grid & circles -->
  <circle cx="150" cy="120" r="280" fill="#38bdf8" opacity="0.07" />
  <circle cx="1050" cy="520" r="320" fill="#818cf8" opacity="0.08" />

  <!-- Main Card -->
  <rect x="80" y="65" width="1040" height="500" rx="28" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>

  <!-- Badge -->
  <rect x="130" y="110" width="320" height="46" rx="23" fill="#0284c7" />
  <text x="290" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">★ OFFICIAL FRIENDSHIP QUIZ</text>

  <!-- Title & Subtitle -->
  <text x="130" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#38bdf8">Fake Friend Tester</text>
  <text x="130" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#f8fafc">Who Really Knows You &amp; Who Is Faking It?</text>
  <text x="130" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">Answer 10 custom questions • Share link • Reveal friends on the live leaderboard</text>

  <!-- Simulated Leaderboard Box -->
  <rect x="130" y="365" width="940" height="155" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <text x="165" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#4ade80">🏆 1st: Sarah — 10/10 (Real Bestie!)</text>
  <text x="165" y="456" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#cbd5e1">🥈 2nd: Alex — 7/10 (Good Friend)</text>
  <text x="165" y="496" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#f87171">🚨 3rd: Jordan — 2/10 (Fake Friend Detected!)</text>

  <rect x="840" y="415" width="200" height="55" rx="27" fill="#f59e0b" />
  <text x="940" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">PLAY FREE ➔</text>
</svg>